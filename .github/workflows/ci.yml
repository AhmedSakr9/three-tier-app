name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Create .env from the template
        run: cp .env.example .env

      - name: Validate the Compose file
        run: docker compose config > /dev/null

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API through Nginx
        run: |
          for i in $(seq 1 30); do
            if curl -fs localhost:8080/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Test the API end to end
        run: |
          curl -fs -X POST localhost:8080/api/notes \
            -H "Content-Type: application/json" \
            -d '{"text":"ci test"}'
          curl -fs localhost:8080/api/notes | grep "ci test"

      - name: Check the API and DB are not exposed
        run: |
          for port in 5000 5432; do
            if curl -s -m 3 localhost:$port > /dev/null 2>&1; then
              echo "Port $port is exposed"
              exit 1
            fi
          done
          echo "Only nginx is exposed"

      - name: Build the API image for scanning
        run: docker build -t three-tier-api:ci ./api

      - name: Scan the API image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: three-tier-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the API image
        run: |
          IMAGE=ghcr.io/ahmedsakr9/three-tier-api
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} ./api
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
